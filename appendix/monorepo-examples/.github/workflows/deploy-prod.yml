# Purpose: production deploy. Runs after nonprod succeeded for the same commit.
# Controls: Environment `production` = named approver (required reviewers, prevent self-review
#   => approver != last pusher), branch main only. Role pipeline-deploy-prod via OIDC
#   (sub: repo:papaya/platform:environment:production). Implements "only pipelines change prod".
name: deploy-prod

on:
  workflow_run:
    workflows: [deploy-nonprod]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production   # approval gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000001 # v4 (placeholder SHA)
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # deploy exactly what was deployed to nonprod
          persist-credentials: false
      - uses: actions/setup-node@0000000000000000000000000000000000000002 # v4 (placeholder SHA)
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@0000000000000000000000000000000000000004 # v4 (placeholder SHA)
        with:
          role-to-assume: arn:aws:iam::111122223333:role/pipeline-deploy-prod
          aws-region: ap-southeast-1
      - name: pulumi up (prod)
        uses: pulumi/actions@0000000000000000000000000000000000000005 # v6 (placeholder SHA)
        with:
          command: up
          stack-name: papaya/prod
          work-dir: infra
        env:
          PULUMI_BACKEND_URL: s3://papaya-pulumi-state?region=ap-southeast-1&awssdk=v2   # placeholder
      - name: serverless deploy (prod)
        run: npx serverless deploy --stage prod
      - name: GCP auth (Workload Identity Federation)
        uses: google-github-actions/auth@0000000000000000000000000000000000000007 # v2 (placeholder SHA)
        with:
          workload_identity_provider: projects/<project-number>/locations/global/workloadIdentityPools/github/providers/papaya-platform
          service_account: platform-deploy-prod@<gcp-project>.iam.gserviceaccount.com
      - name: Firebase deploy (via WIF service account)
        run: npx firebase-tools deploy --project <gcp-project> --non-interactive
      - name: Deployment summary
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          {
            echo "## Deployed prod"
            echo "- commit: \`${HEAD_SHA}\`"
            echo "- triggered by: ${TRIGGER_ACTOR}"
            echo "- approver: see Environment 'production' deployment review on this run"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
