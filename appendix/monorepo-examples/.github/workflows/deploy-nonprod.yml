# Purpose: push to main -> deploy nonprod automatically (Pulumi + Serverless).
# Control: only pipelines change environments; nonprod role has boundary nonprod-boundary
#   and is denied prod via deny-prod. OIDC sub: repo:papaya/platform:environment:nonprod.
name: deploy-nonprod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-nonprod
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000001 # v4 (placeholder SHA)
        with:
          persist-credentials: false
      - uses: actions/setup-node@0000000000000000000000000000000000000002 # v4 (placeholder SHA)
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@0000000000000000000000000000000000000004 # v4 (placeholder SHA)
        with:
          role-to-assume: arn:aws:iam::111122223333:role/pipeline-deploy-nonprod
          aws-region: ap-southeast-1
      - name: pulumi up (nonprod)
        uses: pulumi/actions@0000000000000000000000000000000000000005 # v6 (placeholder SHA)
        with:
          command: up
          stack-name: papaya/nonprod
          work-dir: infra
        env:
          PULUMI_BACKEND_URL: s3://papaya-pulumi-state?region=ap-southeast-1&awssdk=v2   # placeholder
      - name: serverless deploy (nonprod)
        run: npx serverless deploy --stage nonprod
      - name: Deployment summary
        run: |
          {
            echo "## Deployed nonprod"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- pushed by: ${GITHUB_ACTOR}"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
