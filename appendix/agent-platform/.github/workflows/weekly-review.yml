# Purpose: generate the weekly review report from Athena and open a PR for human sign-off.
# Controls: HIPAA 164.308(a)(1)(ii)(D) Information system activity review; ISO A.8.15/A.8.16.
#   Evidence = the merged report PR (approval by a reviewer = sign-off) in evidence/weekly/YYYY-Www.md.
# Identity: role pipeline-weekly-review-readonly (NEW, deviation - see README): Athena read-only on the
#   `audit` database via workgroup `audit-weekly`, S3 read on cloudtrail/ and otel/, write to
#   evidence/weekly/. OIDC sub repo:papaya/agent-platform:ref:refs/heads/main.
#   Why not pipeline-agent-platform: that role is privileged (Identity Center, detections) and trusts only
#   Environment `governance` (2 reviewers); a weekly cron cannot wait on that and must not widen its trust.
#   Why not pipeline-prowler-readonly: different data (CloudTrail/OTel audit data vs posture APIs).
name: weekly-review

on:
  schedule:
    - cron: "0 1 * * 1"   # Monday 01:00 UTC (08:00 ICT)
  workflow_dispatch: {}

concurrency:
  group: weekly-review
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write        # push the report branch
      pull-requests: write   # open the sign-off PR
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000001 # v4 (placeholder SHA)
        with:
          persist-credentials: true   # needed to push the report branch with GITHUB_TOKEN
      - uses: actions/setup-python@0000000000000000000000000000000000000009 # v5 (placeholder SHA)
        with:
          python-version: "3.12"
      - run: pip install boto3
      - uses: aws-actions/configure-aws-credentials@0000000000000000000000000000000000000004 # v4 (placeholder SHA)
        with:
          role-to-assume: arn:aws:iam::111122223333:role/pipeline-weekly-review-readonly
          aws-region: ap-southeast-1
      - name: Render report
        id: render
        run: |
          python3 scripts/weekly_review.py \
            --queries-dir detections/athena \
            --workgroup audit-weekly \
            --database audit \
            --output-dir evidence/weekly \
            --results-location s3://papaya-audit-logs/athena-results/weekly/
          # the script reports on the previous full ISO week (Mon-Sun), same as `7 days ago`
          echo "week=$(date -u -d '7 days ago' +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Copy report to Object Lock evidence bucket
        run: aws s3 cp "evidence/weekly/${{ steps.render.outputs.week }}.md" "s3://papaya-audit-logs/evidence/weekly/${{ steps.render.outputs.week }}.md" --sse aws:kms --sse-kms-key-id alias/audit-logs
      - name: Open sign-off PR
        env:
          GH_TOKEN: ${{ github.token }}   # Verify: repo setting "Allow GitHub Actions to create pull requests" must be ON
          WEEK: ${{ steps.render.outputs.week }}
        run: |
          BR="evidence/weekly-${WEEK}"
          git config user.name "papaya-weekly-review[bot]"
          git config user.email "weekly-review@papaya.invalid"
          git checkout -b "$BR"
          git add "evidence/weekly/${WEEK}.md"
          git commit -m "evidence(weekly): ${WEEK} review report"
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "Weekly review ${WEEK} - sign-off required" \
            --body "Auto-generated weekly review. Reviewer: complete the sign-off block, then approve this PR (approval = sign-off). Rotating reviewer: platform + security." \
            --label weekly-review
